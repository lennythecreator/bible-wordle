<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — Publish Round 2</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1a1b20; color: #e2e2e9; margin: 0; padding: 16px; }
  .panel { background: #26272e; border: 1px solid #5a5c68; border-radius: 12px; padding: 16px; max-width: 480px; margin: 24px auto; }
  .label { font-size: 12px; color: #a9aab4; text-transform: uppercase; letter-spacing: .05em; }
  .field { margin: 10px 0; }
  select, input { width: 100%; background: #33343c; border: 1px solid #5a5c68; color: #e2e2e9; border-radius: 8px; padding: 10px; box-sizing: border-box; }
  .btn { background: #7ec699; color: #0b2416; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .round { display: inline-block; background: #33343c; border-radius: 999px; padding: 3px 12px; font-size: 13px; margin-right: 6px; }
  .round.active { background: #7ec699; color: #0b2416; }
  .today { font-size: 13px; color: #a9aab4; }
  .live { display: inline-block; background: #d9534f; color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 11px; letter-spacing: .08em; margin-left: 8px; vertical-align: middle; }
  .activity { font-size: 12px; color: #a9aab4; margin-top: 8px; }
  .activity span { color: #7ec699; }
</style>
</head>
<body>
  <div class="panel">
    <p class="label">Publish for <span class="live">● LIVE</span></p>
    <div class="field">
      <span class="round">Round 1 — GENESIS</span>
      <span class="round active">Round 2 (new)</span>
    </div>
    <p class="today">Tue Aug 12 — round 2 will appear to players who finished round 1.<br>Updating automatically without a page reload.</p>
    <p class="activity">Today's activity: <span>34 played</span> · <span>22 finished round 1</span> · <span>9 on round 2</span></p>
    <div class="field"><select><option>Select a word...</option><option>EXODUS 2</option><option>1PETER</option></select></div>
    <button class="btn">Publish Round 2</button>
  </div>
</body>
</html>
