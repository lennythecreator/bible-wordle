<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play — Round 2 Board</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1a1b20; color: #e2e2e9; margin: 0; padding: 16px; }
  .header { display: flex; justify-content: space-between; max-width: 420px; margin: 0 auto 12px; font-size: 13px; color: #a9aab4; }
  .pill { background: #7ec699; color: #0b2416; border-radius: 999px; padding: 3px 10px; font-weight: 700; }
  .board { max-width: 420px; margin: 0 auto; display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .tile { height: 46px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
  .t-0 { background: #33343c; }
  .t-c { background: #3e8c5a; }
  .t-w { background: #a06a2d; }
  .t-m { background: #3a3b44; }
</style>
</head>
<body>
  <div class="header">
    <span>Round 2 of 2</span>
    <span class="pill">Today</span>
  </div>
  <div class="board">
    <div class="row">
      <div class="tile t-c">G</div><div class="tile t-c">E</div><div class="tile t-w">N</div><div class="tile t-m">E</div><div class="tile t-m">S</div><div class="tile t-m">I</div><div class="tile t-m">S</div><div class="tile t-c">1</div>
    </div>
    <div class="row">
      <div class="tile t-0">E</div><div class="tile t-0">X</div><div class="tile t-0">O</div><div class="tile t-0">D</div><div class="tile t-0">U</div><div class="tile t-0">S</div><div class="tile t-0">2</div><div class="tile t-0"></div>
    </div>
  </div>
</body>
</html>
